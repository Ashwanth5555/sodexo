; Three processes in one container. autorestart keeps the app alive if one
; falls over; startsecs gives the backend room to import TensorFlow, which
; takes several seconds on a cold start.
[program:mock_api]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8200
directory=/app/mock_api_sodexo
autostart=true
autorestart=true
startsecs=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8300
directory=/app/backend_sodexo
environment=PYTHONPATH="/app/backend_sodexo"
autostart=true
autorestart=true
startsecs=15
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
