server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Uploaded datasets can be tens of MB; the API's own limit is 50MB.
    client_max_body_size 64m;

    # Training a portfolio can take minutes, and the UI polls while it runs.
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    location /api/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Container health probe - answered by the backend, so the container is
    # only healthy when the API behind nginx is actually up.
    location = /health {
        proxy_pass http://127.0.0.1:8300/health;
        access_log off;
    }

    # Vite fingerprints every asset - index-ndgC53HU.js changes name whenever
    # its contents change - so they can be cached indefinitely and a new build
    # simply asks for different filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached. It is the one file with a fixed name, and
    # it is what names the fingerprinted bundle. Served without Cache-Control
    # a browser caches it heuristically, and a returning visitor then loads the
    # PREVIOUS build's bundle from a server that is serving the new one - the
    # deploy looks like it did nothing. Revalidating one small file per visit
    # is the whole cost of avoiding that.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Single-page app: unknown paths are client-side routes (/data-quality,
    # /labor-forecasting/...), so they must return index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
